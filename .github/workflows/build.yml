name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          export BUILD_OZDROID=1
          yes | buildozer android debug 2>&1 | tee build.log
          # Если сборка упала, показать последние 200 строк лога
          if [ $? -ne 0 ]; then
            echo "=== LAST 200 LINES OF BUILD LOG ==="
            tail -200 build.log
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obd2-apk
          path: bin/*.apk
