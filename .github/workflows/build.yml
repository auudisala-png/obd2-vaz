name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: FULL Clean Buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer
          rm -rf ~/.local/share/buildozer
          rm -rf ~/.cache/pip

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install --no-cache-dir buildozer cython==0.29.33

      - name: FORCE FIX - Patch buildozer.spec
        run: |
          echo "=== ПРОВЕРЯЕМ buildozer.spec ==="
          cat buildozer.spec | grep requirements
          echo "=== ЗАМЕНЯЕМ requirements ==="
          sed -i 's/requirements = .*/requirements = python3,kivy/g' buildozer.spec
          echo "=== ПРОВЕРЯЕМ ПОСЛЕ ЗАМЕНЫ ==="
          cat buildozer.spec | grep requirements

      - name: Build APK
        run: buildozer android debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obd2-apk
          path: bin/*.apk
