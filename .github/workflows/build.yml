name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Force NDK 25b
        run: |
          # Удаляем старый NDK
          rm -rf ~/.buildozer/android/platform/android-ndk-r23b
          rm -rf ~/.buildozer/android/platform/android-ndk-r25b
          # Удаляем кэш
          rm -rf ~/.buildozer/android/platform/build*
          rm -rf ~/.buildozer/android/platform/python-for-android

      - name: Build APK
        run: |
          # Принудительно указываем NDK 25b
          export ANDROIDNDK=/home/runner/.buildozer/android/platform/android-ndk-r25b
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: obd2-apk
          path: bin/*.apk
